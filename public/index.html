<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Crew</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7385; --border: #e2e5ea;
    --accent: #3b5bdb; --ok: #2b8a3e; --warn: #c77700; --bad: #c92a2a; --code: #f1f3f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12141a; --panel: #1b1e26; --text: #e6e8ee; --muted: #9098aa; --border: #2c303b;
      --accent: #748ffc; --ok: #51cf66; --warn: #fcc419; --bad: #ff6b6b; --code: #23262f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; }
  .muted { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; padding: 16px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 16px; min-width: 0; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
  input, textarea { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  button { padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; font: inherit; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .task { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 10px; }
  .task .name { font-weight: 600; }
  .task .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; }
  .succeeded { color: var(--ok); } .failed { color: var(--bad); } .running { color: var(--accent); }
  #feed { height: 420px; overflow-y: auto; font-size: 13px; }
  .msg { padding: 6px 8px; border-left: 3px solid var(--border); margin-bottom: 4px; white-space: pre-wrap; word-break: break-word; }
  .msg .who { font-weight: 600; }
  .msg.nudge { border-color: var(--warn); } .msg.intervene, .msg.handoff { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .msg.feedback { border-color: var(--accent); } .msg.error { border-color: var(--bad); } .msg.plan { border-color: var(--ok); }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 6px; border-bottom: 1px solid var(--border); font-size: 13px; }
  tr.clickable { cursor: pointer; }
  pre { background: var(--code); padding: 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; max-height: 420px; overflow: auto; }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .step { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--code); }
  .step.done { color: var(--ok); } .step.running { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Agent Crew</h1>
  <span class="muted">Planner, workers and a reviewer run your tasks on a schedule; a supervisor keeps them from stalling.</span>
  <span id="mode" class="pill"></span>
</header>
<main>
  <div>
    <section>
      <h2>New task</h2>
      <form id="form">
        <label for="name">What should the crew do?</label>
        <input id="name" required placeholder="e.g. Summarize today's top AI news">
        <label for="desc">Details (optional)</label>
        <textarea id="desc" placeholder="Format, audience, constraints…"></textarea>
        <div class="row">
          <div><label for="interval">Run every (minutes)</label><input id="interval" type="number" min="1" value="60"></div>
          <div><label for="workers">Workers</label><input id="workers" type="number" min="1" max="5" value="2"></div>
        </div>
        <p><button class="primary" type="submit">Add &amp; run now</button></p>
      </form>
    </section>
    <section>
      <h2>Tasks</h2>
      <div id="tasks" class="muted">No tasks yet.</div>
    </section>
  </div>
  <div>
    <section>
      <h2>Live team chat</h2>
      <div id="live"></div>
      <div id="feed"><div class="muted">Agent messages appear here while a task runs.</div></div>
    </section>
    <section>
      <h2>Run history</h2>
      <table><thead><tr><th>Task</th><th>Status</th><th>Started</th><th>Took</th></tr></thead><tbody id="runs"></tbody></table>
      <div id="detail"></div>
    </section>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
const api = (p, opts = {}) => fetch(p, { headers: { "content-type": "application/json" }, ...opts }).then((r) => r.status === 204 ? null : r.json());
const time = (t) => t ? new Date(t).toLocaleString() : "—";
const dur = (a, b) => a && b ? `${Math.round((b - a) / 1000)}s` : "—";

api("/api/info").then((i) => { $("#mode").textContent = i.mode === "mock" ? "Demo mode (no API key)" : `Claude · ${i.model}`; });

$("#form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const res = await api("/api/tasks", { method: "POST", body: JSON.stringify({
    name: $("#name").value, description: $("#desc").value,
    intervalMinutes: Number($("#interval").value), workers: Number($("#workers").value),
  }) });
  if (res.error) return alert(res.error);
  e.target.reset(); $("#interval").value = 60; $("#workers").value = 2;
});

function renderTasks(tasks) {
  const box = $("#tasks");
  box.replaceChildren();
  if (!tasks.length) return box.append("No tasks yet.");
  box.classList.remove("muted");
  for (const t of tasks) {
    const status = t.running ? el("span", { className: "pill running", textContent: "running" })
      : t.lastStatus ? el("span", { className: `pill ${t.lastStatus}`, textContent: t.lastStatus }) : "";
    const toggle = el("button", { textContent: t.enabled ? "Pause schedule" : "Resume schedule" });
    toggle.onclick = () => api(`/api/tasks/${t.id}`, { method: "PATCH", body: JSON.stringify({ enabled: !t.enabled }) });
    const run = el("button", { textContent: "Run now", disabled: t.running });
    run.onclick = () => api(`/api/tasks/${t.id}/run`, { method: "POST" });
    const del = el("button", { textContent: "Delete" });
    del.onclick = () => confirm(`Delete "${t.name}"?`) && api(`/api/tasks/${t.id}`, { method: "DELETE" });
    box.append(el("div", { className: "task" },
      el("div", { className: "name", textContent: t.name }), " ", status,
      el("div", { className: "muted", textContent: `Every ${t.intervalMinutes} min · ${t.workers} worker(s) · ${t.enabled ? `next ${time(t.nextRunAt)}` : "paused"}` }),
      el("div", { className: "actions" }, run, toggle, del)));
  }
}

function addMessage(m) {
  const feed = $("#feed");
  if (feed.firstChild?.classList?.contains("muted")) feed.replaceChildren();
  const stick = feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 20;
  feed.append(el("div", { className: `msg ${m.type}` },
    el("span", { className: "who", textContent: `${m.from}${m.to !== "all" ? " → " + m.to : ""}` }),
    el("span", { className: "muted", textContent: `  ${new Date(m.at).toLocaleTimeString()} · ${m.type}` }),
    el("div", { textContent: m.content })));
  while (feed.childElementCount > 400) feed.firstChild.remove();
  if (stick) feed.scrollTop = feed.scrollHeight;
}

function renderLive(run) {
  const live = $("#live");
  if (run.status !== "running") { live.replaceChildren(); loadRuns(); return; }
  live.replaceChildren(el("div", { className: "muted", textContent: `Running: ${run.taskName}` }),
    el("div", { className: "steps" }, ...run.steps.map((s, i) => el("span", { className: `step ${s.status}`, textContent: `${i + 1}. ${s.title}${s.worker ? " · " + s.worker : ""}` }))));
}

async function loadRuns() {
  const runs = await api("/api/runs");
  $("#runs").replaceChildren(...runs.map((r) => {
    const tr = el("tr", { className: "clickable" },
      el("td", { textContent: r.taskName }), el("td", {}, el("span", { className: `pill ${r.status}`, textContent: r.status })),
      el("td", { textContent: time(r.startedAt) }), el("td", { textContent: dur(r.startedAt, r.finishedAt) }));
    tr.onclick = () => showRun(r.id);
    return tr;
  }));
}

async function showRun(id) {
  const r = await api(`/api/runs/${id}`);
  const stalls = r.messages.filter((m) => ["nudge", "intervene", "handoff"].includes(m.type)).length;
  $("#detail").replaceChildren(
    el("h2", { textContent: `${r.taskName} — ${r.status}`, style: "margin-top:14px" }),
    el("div", { className: "muted", textContent: `${r.steps.length} steps · ${r.messages.length} messages · ${stalls} supervisor interventions` }),
    r.error ? el("p", { className: "failed", textContent: r.error }) : "",
    el("pre", { textContent: r.result || "(no final result)" }));
}

const events = new EventSource("/api/events");
events.addEventListener("tasks", (e) => renderTasks(JSON.parse(e.data)));
events.addEventListener("message", (e) => addMessage(JSON.parse(e.data)));
events.addEventListener("run", (e) => renderLive(JSON.parse(e.data)));
loadRuns();
</script>
</body>
</html>
