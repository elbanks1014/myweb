name: AnimeVerse Hub Reels

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, don't post"
        type: boolean
        default: false

concurrency: animeverse-reels

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install pillow numpy
      - name: Render clip
        working-directory: animeverse
        run: python make_clip.py --out clip.mp4 > post.json
      - uses: actions/upload-artifact@v4
        with:
          name: clip
          path: animeverse/clip.mp4
          retention-days: 7
      - name: Post Reel to Facebook
        working-directory: animeverse
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          DRY_RUN: ${{ (inputs.dry_run || secrets.FB_PAGE_ACCESS_TOKEN == '') && '1' || '0' }}
        run: python post_reel.py clip.mp4 post.json
